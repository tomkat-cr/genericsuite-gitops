
# IMPORTANT:
# Replace exampleapp with the name of the project
# Replace exampleapp_docker_account with the Docker Hub account where the images are stored
# Replace exampleapp_secret_generic with the name of the secret where the environment variables are stored

services:
  exampleapp_frontend:
    container_name: ${APP_NAME:-exampleapp}_frontend
    image: ${IMAGE_REGISTRY:-exampleapp_docker_account}/${APP_NAME:-exampleapp}_frontend:v${APP_VERSION}-amd64
    # To force a platform, uncomment or set APP_PLATFORM, e.g. linux/x86_64 or linux/arm64
    # platform: ${APP_PLATFORM:-linux/x86_64}
    restart: unless-stopped
    ports:
      - 3001:3001
    expose:
      - 3001
    environment:
      # - REACT_APP_API_URL=http://${APP_NAME:-exampleapp}_backend:5000
      - REACT_APP_API_URL=$APP_REACT_APP_API_URL
    networks:
      - backend
      # - my_shared_network

  exampleapp_backend:
    container_name: ${APP_NAME:-exampleapp}_backend
    image: ${IMAGE_REGISTRY:-exampleapp_docker_account}/${APP_NAME:-exampleapp}_backend:v${APP_VERSION}-amd64
    # platform: ${APP_PLATFORM:-linux/x86_64}
    restart: unless-stopped
    ports:
      - 5000:5000
    expose:
      - 5000
    environment:
      - FLASK_APP=exampleapp_api
      - FLASK_ENV=exampleapp_api
      - FLASK_DEBUG=0
      - APP_DB_NAME=exampleapp_dev
      - APP_DB_URI=$APP_DB_URI
      - APP_SECRET_KEY=$APP_SECRET_KEY
    networks:
      - backend
      # - my_shared_network

networks:
  backend:

# my_shared_network:
#   external: true # Reference the same external network as the other services
