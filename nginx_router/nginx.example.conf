server {
  listen 80;

  ###########################
  # HTTP CONFIGURATION
  ###########################

  # Replace exampleserver.com with your domain
  server_name exampleserver.com;

  # Replace with your own root and index
  # root /usr/share/nginx/html;
  # index index.html;

  # location / {
  #   try_files $uri /index.html;
  # }

  ###########################
  # PROXY CONFIGURATION
  ###########################

  # Replace the different path/services with your own
  # Replace `my_app` with the name of your app
  # Replace `4000` with the port of your app
  location / {
    proxy_pass http://my_app:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  location /socket.io {
    proxy_pass http://my_app:4000/socket.io;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;
}

server {
  listen 443 ssl;

  ###########################
  # HTTPS CONFIGURATION
  ###########################

  # Replace exampleserver.com with your domain
  server_name exampleserver.com;

  # Replace with your own root and index
  # root /usr/share/nginx/html;
  # index index.html;

  # location / {
  #   try_files $uri /index.html;
  #   proxy_set_header Permissions-Policy "encrypted-media *";
  # }

  ###########################
  # PROXY CONFIGURATION
  ###########################

  # Replace the different path/services with your own
  # Replace `my_app` with the name of your app
  # Replace 4000 with the port of your app
  location / {
    proxy_pass http://my_app:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  location /socket.io {
    proxy_pass http://my_app:4000/socket.io;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  ###########################
  # SSL CONFIGURATION
  ###########################

  # Replace exampleserver.com with your domain
  ssl_certificate /etc/nginx/ssl/exampleserver.com.crt;
  ssl_certificate_key /etc/nginx/ssl/exampleserver.com.key;
  ssl_client_certificate /etc/nginx/ssl/ca.crt;

  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;
}
